name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Backend Lint
  # ────────────────────────────────────────────────────────────────────────────
  backend-lint:
    name: "Backend Lint (ruff)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Lint with ruff
        run: |
          cd backend
          ruff check app/
      - name: Format check with ruff
        run: |
          cd backend
          ruff format --check app/

  # ────────────────────────────────────────────────────────────────────────────
  # Security Scanning
  # ────────────────────────────────────────────────────────────────────────────
  security-scan:
    name: "Security Scan (pip-audit + npm audit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python dependency vulnerability scan
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Python dependency audit
        run: pip-audit -r backend/requirements.txt
        continue-on-error: false  # Kritik açık varsa pipeline dursun

      # Node.js dependency vulnerability scan
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: |
          cd frontend
          npm ci
      - name: Frontend npm audit
        run: |
          cd frontend
          npm audit --audit-level=high
        continue-on-error: true  # Frontend için uyarı verir ama durdurmaz

  # ────────────────────────────────────────────────────────────────────────────
  # Backend Test — SQLite (hızlı, her push'ta)
  # ────────────────────────────────────────────────────────────────────────────
  backend-test:
    name: "Backend Tests (SQLite + coverage)"
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Run tests with coverage
        env:
          DATABASE_URL: "sqlite:///./test.db"
          SECRET_KEY: "test-secret-key-for-ci-minimum-32-chars!!"
          ENVIRONMENT: "development"
        run: |
          cd backend
          pytest tests/ -v \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=55 \
            --durations=10
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  # ────────────────────────────────────────────────────────────────────────────
  # Backend Integration Test — PostgreSQL (main branch ve PR'larda)
  # ────────────────────────────────────────────────────────────────────────────
  backend-integration-test:
    name: "Backend Integration Tests (PostgreSQL)"
    runs-on: ubuntu-latest
    needs: backend-lint
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: sehrim_test
          POSTGRES_PASSWORD: REDACTED_TEST_PASS
          POSTGRES_DB: sehriminuzmani_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Run integration tests
        env:
          DATABASE_URL: "postgresql+psycopg2://sehrim_test:REDACTED_TEST_PASS@localhost:5432/sehriminuzmani_test"
          SECRET_KEY: "test-secret-key-for-integration-ci-minimum-32-chars!!"
          ENVIRONMENT: "development"
          REDIS_HOST: "localhost"
          REDIS_PORT: "6379"
        run: |
          cd backend
          pytest tests/ -v \
            --cov=app \
            --cov-report=xml \
            --durations=10 \
            -x
      - name: Upload integration coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage-report
          path: backend/coverage.xml

  # ────────────────────────────────────────────────────────────────────────────
  # Frontend Build
  # ────────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: "Frontend Build (TypeScript + Vite)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: TypeScript check
        run: |
          cd frontend
          npx tsc --noEmit
      - name: Build
        run: |
          cd frontend
          npm run build

  # ────────────────────────────────────────────────────────────────────────────
  # Deploy (sadece main branch push'unda)
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: "Deploy"
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend-test, backend-integration-test, frontend-build, security-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy notification
        run: echo "Deploy adımlari buraya eklenecek (örn. SSH, Docker, Kamal)"
